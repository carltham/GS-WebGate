spring.application.name=GS-searcher
server.port=8081

# Relay configuration
relay.base.url=http://localhost:8080

# CRITICAL SECURITY - Prevent internet exposure
# LAYER 1: Localhost-only binding (127.0.0.1, ::1)
# LAYER 2: Environment variable confirmation required (SEARCHER_PRIVATE_MODE=true)
# LAYER 3: HTTP scheme only (not HTTPS)
# ALL layers must pass for searches to execute
searcher.require-private-environment=true
searcher.private-mode-enabled=false

# Resilience configuration
searcher.max-poll-retries=3
searcher.max-submit-retries=3
searcher.poll-timeout-ms=5000
searcher.search-timeout-ms=30000

# Logging
logging.level.com.gswebgate.searcher.SecurityValidator=INFO
logging.level.com.gswebgate.searcher.SearcherWorker=INFO
