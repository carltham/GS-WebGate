server.port=0
relay.base.url=http://localhost:8080

# Security configuration
searcher.require-private-environment=true
searcher.private-mode-enabled=true

# Resilience configuration
searcher.max-poll-retries=3
searcher.max-submit-retries=3
searcher.poll-timeout-ms=5000
searcher.search-timeout-ms=30000

# Dead-Letter Queue (in-memory H2 for tests)
searcher.dlq-enabled=true
searcher.dlq-max-attempts=3

# DLQ Sync to Relay (background sync task)
searcher.dlq-sync-enabled=true
searcher.dlq-sync-interval-ms=300000
searcher.dlq-sync-batch-size=10

# H2 Database Configuration for testing
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=false
