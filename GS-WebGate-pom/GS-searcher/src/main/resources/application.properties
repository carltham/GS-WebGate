spring.application.name=GS-searcher
server.port=8081

# Relay configuration
relay.base.url=http://localhost:8080

# CRITICAL SECURITY - Prevent internet exposure
# LAYER 1: Localhost-only binding (127.0.0.1, ::1)
# LAYER 2: Environment variable confirmation required (SEARCHER_PRIVATE_MODE=true)
# LAYER 3: HTTP scheme only (not HTTPS)
# ALL layers must pass for searches to execute
searcher.require-private-environment=true
searcher.private-mode-enabled=false

# Resilience configuration
searcher.max-poll-retries=3
searcher.max-submit-retries=3
searcher.poll-timeout-ms=5000
searcher.search-timeout-ms=30000

# Dead-Letter Queue (file-based H2 database)
searcher.dlq-enabled=true
searcher.dlq-max-attempts=3

# DLQ Sync to Relay (background sync task)
searcher.dlq-sync-enabled=true
searcher.dlq-sync-interval-ms=300000
searcher.dlq-sync-batch-size=10

# H2 Database Configuration for local DLQ persistence
spring.datasource.url=jdbc:h2:file:./data/searcher-dlq
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# Dead-Letter Queue (DLQ) configuration
searcher.dlq-enabled=true
searcher.dlq-max-attempts=3

# Logging
logging.level.com.gswebgate.searcher.SecurityValidator=INFO
logging.level.com.gswebgate.searcher.SearcherWorker=INFO
logging.level.com.gswebgate.searcher.DeadLetterQueueService=INFO
